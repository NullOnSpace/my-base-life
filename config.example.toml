[logging]
level = "INFO"

[redis]
host = "localhost"
port = 6379
db = 0
password = ""
msgs_stream = "stream:msgs:in"  # push.v1 canonical 消息发布目标（XADD；field "data" 契约见 streams-lib）
dedup-set = "base-life:published"  # 去重集合（只记已发布 URL）

[[sources]]
name = "daringfireball"
url = "https://daringfireball.net/archive/"

[sources.selectors]
list_selector = "div.archive p > a"
title = "h1"
pub = "h6.dateline"
pub-format = "%d %B %Y"
content = "div.article"
search = ["MacBook Neo"]
