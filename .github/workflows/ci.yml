name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Checkout canonical-msg (push.v1 契约 gen/)
        uses: actions/checkout@v4
        with:
          repository: NullOnSpace/canonical-msg
          path: canonical-msg

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          CANONICAL_MSG_GEN_PATH: ${{ github.workspace }}/canonical-msg/gen/python
        run: uv run pytest test_e2e.py -v
